name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder only — `prisma generate`/`prisma validate` read the schema,
      # they don't connect. No real database is touched during CI.
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      # `next build` runs its own full TypeScript check as part of the build —
      # a standalone `tsc --noEmit` here would fail on a fresh checkout since
      # it references ambient route types (LayoutProps etc.) that Next only
      # generates during dev/build, in .next/types/.
      - run: npm run build
